<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiBo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060a14">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #060a14; 
    }
    /* Contenedor que recorta la parte superior donde Google coloca el banner */
    .app-container {
      position: absolute;
      top: -50px; /* Oculta los ~50px del banner de Google fuera de la pantalla */
      left: 0;
      width: 100%;
      height: calc(100% + 50px);
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- REEMPLAZA ESTA URL POR LA DE TU GOOGLE APPS SCRIPT -->
    <iframe src="https://script.google.com/macros/s/AKfycbw1hEiNXWueZ2O79IkRkjy2jrmDY4cNcPlidOD-cjAYB2vN8N62j3qJIHi6kFhvCiKF/exec" allow="clipboard-write; clipboard-read; cookies"></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
